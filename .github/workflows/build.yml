name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: GuitarPad-Windows
          - os: macos-latest
            name: GuitarPad-macOS
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Testes
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/GuitarPad_artefacts/Release/GuitarPad.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath GuitarPad-Windows.zip

      - name: Empacotar (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp -R build/GuitarPad_artefacts/Release/GuitarPad.app dist/
          cp README.md dist/
          cd dist && ditto -c -k --keepParent GuitarPad.app ../GuitarPad-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.zip
