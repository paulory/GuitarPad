name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: GuitarPad-Windows
          - os: macos-latest
            name: GuitarPad-macOS
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Testes
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/GuitarPad_artefacts/Release/GuitarPad.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath GuitarPad-Windows.zip

      - name: Empacotar DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          # mostra o erro como anotacao (visivel no resumo do build)
          fail() { echo "::error title=DMG::$1 :: $(tail -c 800 out.txt | tr '\n' ' ')"; exit 1; }

          APP=$(find build -name "GuitarPad.app" -maxdepth 4 -type d | head -1)
          [ -n "$APP" ] || { find build -maxdepth 3 > out.txt; fail "GuitarPad.app nao encontrado"; }
          echo "App: $APP"

          # assinatura ad-hoc (sem conta de desenvolvedor), necessaria para rodar em Apple Silicon
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP" > out.txt 2>&1 || fail "codesign"
          lipo -info "$APP/Contents/MacOS/GuitarPad"

          rm -rf dmg && mkdir -p dmg
          ditto "$APP" dmg/GuitarPad.app
          ln -s /Applications dmg/Applications
          cp README.md dmg/Leia-me.md

          # hdiutil as vezes falha com "Resource busy" nos runners: tenta de novo
          ok=0
          for i in 1 2 3 4 5; do
            if hdiutil create -volname GuitarPad -srcfolder dmg -fs HFS+ -format UDZO -ov GuitarPad-macOS.dmg > out.txt 2>&1; then ok=1; break; fi
            cat out.txt; echo "tentativa $i falhou"; sleep 10
          done
          [ $ok = 1 ] || fail "hdiutil create"
          hdiutil verify GuitarPad-macOS.dmg > out.txt 2>&1 || fail "hdiutil verify"
          ls -la GuitarPad-macOS.dmg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.dmg

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.${{ runner.os == 'macOS' && 'dmg' || 'zip' }}
